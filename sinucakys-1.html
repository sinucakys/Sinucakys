<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINUCAKYS — Gestão Empresarial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F6F8F6; --surface:#FFFFFF; --surface-2:#EEF2EF; --border:#DCE4DE;
    --text:#16241C; --text-muted:#5B6B60;
    --primary:#1B4332; --primary-2:#2D6A4F; --primary-soft:#E5F0EA;
    --accent:#A9824C;
    --danger:#B3261E; --danger-soft:#FBEAE9;
    --warning:#8A5A00; --warning-soft:#FCF1DC;
    --success:#1B7A43; --success-soft:#E4F3E9;
    --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
    --shadow:0 1px 2px rgba(20,30,24,.06), 0 6px 20px -8px rgba(20,30,24,.12);
    --font-head:'Sora',system-ui,-apple-system,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1512; --surface:#161F19; --surface-2:#1D2921; --border:#2A3830;
      --text:#E7EFE9; --text-muted:#93A69A;
      --primary:#57B788; --primary-2:#78CBA2; --primary-soft:#1B2E24;
      --accent:#C9A868;
      --danger:#E5726A; --danger-soft:#341D1B;
      --warning:#E0B94C; --warning-soft:#332912;
      --success:#57B788; --success-soft:#17281F;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1512; --surface:#161F19; --surface-2:#1D2921; --border:#2A3830;
    --text:#E7EFE9; --text-muted:#93A69A;
    --primary:#57B788; --primary-2:#78CBA2; --primary-soft:#1B2E24;
    --accent:#C9A868;
    --danger:#E5726A; --danger-soft:#341D1B;
    --warning:#E0B94C; --warning-soft:#332912;
    --success:#57B788; --success-soft:#17281F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  h1,h2,h3,.font-head{font-family:var(--font-head);}
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--primary-soft);}
  .scroll-x{overflow-x:auto; max-width:100%;}
  table{border-collapse:collapse; width:100%; min-width:560px;}
  th,td{text-align:left; padding:10px 12px; font-size:13.5px; border-bottom:1px solid var(--border); white-space:nowrap;}
  th{color:var(--text-muted); font-weight:600; font-size:12px; text-transform:none; letter-spacing:.01em;}
  tr:last-child td{border-bottom:none;}
  input,select,textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface); color:var(--text); font-size:14px; font-family:inherit;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-2); outline-offset:1px; border-color:var(--primary-2);}
  label{font-size:12.5px; color:var(--text-muted); display:block; margin-bottom:5px; font-weight:500;}
  .btn{
    display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface); color:var(--text); font-size:13.5px;
    font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2);}
  .btn:focus-visible{outline:2px solid var(--primary-2); outline-offset:2px;}
  .btn-primary{background:var(--primary); border-color:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-2); border-color:var(--primary-2);}
  .btn-ghost{background:transparent; border-color:transparent;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{color:var(--danger); border-color:var(--danger-soft); background:var(--danger-soft);}
  .btn-sm{padding:6px 10px; font-size:12.5px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .icon{width:18px; height:18px; flex-shrink:0;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow);}
  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600;}
  .pill-success{background:var(--success-soft); color:var(--success);}
  .pill-warning{background:var(--warning-soft); color:var(--warning);}
  .pill-danger{background:var(--danger-soft); color:var(--danger);}
  .pill-muted{background:var(--surface-2); color:var(--text-muted);}

  /* shell layout */
  #shell{display:flex; min-height:100vh;}
  #sidebar{
    width:236px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border);
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:20px 18px 16px;}
  .brand-mark{width:34px; height:34px; border-radius:10px; background:var(--primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .brand-mark svg{width:19px; height:19px; stroke:#fff;}
  .brand-name{font-family:var(--font-head); font-weight:700; font-size:16.5px; letter-spacing:.01em; line-height:1.1;}
  .brand-sub{font-size:10.5px; color:var(--text-muted); margin-top:1px;}
  nav.sidenav{flex:1; overflow-y:auto; padding:6px 12px;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:var(--radius-sm);
    color:var(--text-muted); font-size:13.5px; font-weight:600; cursor:pointer; margin-bottom:2px;
  }
  .nav-item:hover{background:var(--surface-2); color:var(--text);}
  .nav-item.active{background:var(--primary-soft); color:var(--primary);}
  .nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); opacity:.7; padding:14px 12px 6px;}
  .sidebar-foot{padding:14px; border-top:1px solid var(--border);}
  .company-chip{display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:var(--radius-sm); background:var(--surface-2);}
  .company-chip .dot{width:8px; height:8px; border-radius:99px; background:var(--success); flex-shrink:0;}
  #main{flex:1; min-width:0; display:flex; flex-direction:column;}
  #topbar{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 24px; border-bottom:1px solid var(--border); background:var(--bg);
    position:sticky; top:0; z-index:10;
  }
  #content{padding:22px 24px 90px; flex:1;}
  .page-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
  .page-title{font-family:var(--font-head); font-size:21px; font-weight:700; margin:0;}
  .page-desc{color:var(--text-muted); font-size:13px; margin-top:3px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .kpi{padding:16px 18px;}
  .kpi-label{font-size:12px; color:var(--text-muted); font-weight:600;}
  .kpi-value{font-family:var(--font-head); font-size:23px; font-weight:700; margin-top:6px;}
  .kpi-delta{font-size:11.5px; margin-top:5px; display:flex; align-items:center; gap:4px;}
  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:14px;}
  .section-title{font-family:var(--font-head); font-weight:700; font-size:14.5px; margin:0;}
  .card-pad{padding:16px 18px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border);}
  .empty{padding:32px 18px; text-align:center; color:var(--text-muted); font-size:13.5px;}
  .empty svg{width:30px; height:30px; margin-bottom:8px; opacity:.5;}

  .toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
  .search-box{position:relative; flex:1; min-width:180px; max-width:320px;}
  .search-box svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--text-muted);}
  .search-box input{padding-left:32px;}

  /* modal */
  #modal-root{position:fixed; inset:0; z-index:100; display:none; align-items:flex-start; justify-content:center; padding:5vh 16px;}
  #modal-root.open{display:flex;}
  .modal-backdrop{position:absolute; inset:0; background:rgba(10,16,12,.45); backdrop-filter:blur(1px);}
  .modal-box{position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow); width:100%; max-width:520px; max-height:88vh; display:flex; flex-direction:column;}
  .modal-box.wide{max-width:680px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
  .modal-body{padding:18px 20px; overflow-y:auto;}
  .modal-foot{padding:14px 20px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:9px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .field{margin-bottom:12px;}

  .line-item{display:grid; grid-template-columns:2.2fr .8fr .9fr auto; gap:8px; align-items:end; margin-bottom:8px;}
  .line-total-row{display:flex; justify-content:flex-end; gap:22px; padding-top:10px; margin-top:6px; border-top:1px solid var(--border);}
  .line-total-row .amt{font-family:var(--font-head); font-weight:700; font-size:16px;}

  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px;}
  .toast{background:var(--text); color:var(--bg); padding:10px 16px; border-radius:var(--radius-sm); font-size:13px; box-shadow:var(--shadow); max-width:300px;}
  .toast.warn{background:var(--warning); color:#1a1200;}
  .toast.err{background:var(--danger); color:#fff;}

  /* bottom nav mobile */
  #bottomnav{display:none;}
  @media (max-width: 860px){
    #sidebar{display:none;}
    #content{padding:16px 14px 96px;}
    #topbar{padding:12px 14px;}
    .kpi-grid{grid-template-columns:1fr 1fr;}
    .grid-2{grid-template-columns:1fr;}
    .field-row{grid-template-columns:1fr;}
    .line-item{grid-template-columns:1fr; }
    #bottomnav{
      display:flex; position:fixed; bottom:0; left:0; right:0; z-index:60;
      background:var(--surface); border-top:1px solid var(--border);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .bn-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; color:var(--text-muted); font-size:10px; font-weight:600; border-radius:10px;}
    .bn-item.active{color:var(--primary);}
    .bn-item svg{width:20px; height:20px;}
  }
  @media (min-width: 861px){
    #menu-toggle{display:none;}
  }

  /* login */
  #login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:
     radial-gradient(700px 400px at 15% -10%, var(--primary-soft), transparent),
     var(--bg);}
  .login-card{width:100%; max-width:380px;}
  .login-hero{text-align:left; margin-bottom:26px;}

  /* invoice print */
  .invoice-sheet{background:#fff; color:#16241C; padding:28px; border-radius:var(--radius-md); font-size:13px;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{position:absolute; top:0; left:0; width:100%;}
  }
</style>
</head>

    vendas:[], facturas:[], compras:[],
    caixa:{saldoInicial:50000, aberto:true, movimentos:[]},
    contadores:{factura:0},
    notificacoes:[],
    route:'dashboard'
  };
  // seed some historic sales for the last 7 days so dashboard charts aren't empty
  for(let i=6;i>=0;i--){
    const dia = daysAgoISO(i);
    const n = 1 + Math.floor(Math.random()*4);
    for(let k=0;k<n;k++){
      const prod = produtos[Math.floor(Math.random()*produtos.length)];
      const cli = clientes[Math.floor(Math.random()*(clientes.length-1))];
      const qty = 1+Math.floor(Math.random()*3);
      const total = prod.precoVenda*qty;
      const saleId = uid();
      db.contadores.factura++;
      const num = 'FT '+new Date().getFullYear()+'/'+String(db.contadores.factura).padStart(4,'0');
      db.vendas.push({id:saleId, data:dia, clienteId:cli.id, itens:[{produtoId:prod.id, nome:prod.nome, qtd:qty, preco:prod.precoVenda}], total, pagamento:'Dinheiro', facturaNumero:num});
      db.facturas.push({id:uid(), numero:num, data:dia, clienteId:cli.id, itens:[{nome:prod.nome, qtd:qty, preco:prod.precoVenda}], total, estado:'Paga'});
      db.caixa.movimentos.push({id:uid(), data:dia, tipo:'entrada', categoria:'Venda', descricao:'Venda '+num, valor:total});
      cli.totalComprado += total;
    }
  }
  return db;
}
function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(parsed && parsed.produtos) return parsed; }
  }catch(e){ console.error('Falha ao ler dados guardados', e); }
  return seedDB();
}
function saveDB(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }
  catch(e){ console.error('Falha ao guardar dados', e); toast('Não foi possível guardar localmente neste browser.', 'warn'); }
}

/* ---------------- TOASTS ---------------- */
function toast(msg, kind){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast'+(kind==='warn'?' warn':kind==='err'?' err':'');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}

  saleLineSubtotal(ln){ const p = DB.produtos.find(x=>x.id===ln.produtoId); return p ? p.precoVenda*ln.qtd : 0; },
  addSaleLine(){ this._saleLines.push({produtoId: DB.produtos[0]?DB.produtos[0].id:'', qtd:1}); this.refreshSaleModal(); },
  removeSaleLine(idx){ if(this._saleLines.length<=1) return; this._saleLines.splice(idx,1); this.refreshSaleModal(); },

    const cliente = document.getElementById('vf-cliente') ? document.getElementById('vf-cliente').value : null;

    document.getElementById('modal-box-wrap').innerHTML = '<div class="modal-box wide">'+this.saleModalHtml()+'</div>';

  submitVenda(){
    const clienteId = document.getElementById('vf-cliente').value;
    const pagamento = document.getElementById('vf-pag').value;
    const cliente = DB.clientes.find(c=>c.id===clienteId);
    // check stock
    for(const ln of this._saleLines){
      const p = DB.produtos.find(x=>x.id===ln.produtoId);
      if(p && p.stock < ln.qtd && p.stockMin >= 0 && p.stock !== 9999){
        if(!confirm('Stock insuficiente para "'+p.nome+'" (disponível: '+p.stock+'). Continuar mesmo assim?')) return;
      }
    }
    const itens = this._saleLines.map(ln=>{
      const p = DB.produtos.find(x=>x.id===ln.produtoId);
      return {produtoId:p.id, nome:p.nome, qtd:ln.qtd, preco:p.precoVenda};
    });
    const total = itens.reduce((s,i)=>s+i.qtd*i.preco,0);
    // decrement stock
    itens.forEach(i=>{ const p = DB.produtos.find(x=>x.id===i.produtoId); if(p && p.stock!==9999) p.stock = Math.max(0, p.stock-i.qtd); });
    DB.contadores.factura++;
    const numero = 'FT '+new Date().getFullYear()+'/'+String(DB.contadores.factura).padStart(4,'0');
    const data = todayISO();
    const saleId = uid();
    DB.vendas.push({id:saleId, data, clienteId, itens, total, pagamento, facturaNumero:numero});
    DB.facturas.push({id:uid(), numero, data, clienteId, itens, total, estado: pagamento==='Crédito'?'Por cobrar':'Paga'});
    if(pagamento==='Crédito'){
      if(cliente) cliente.divida = (cliente.divida||0)+total;
    } else {
      DB.caixa.movimentos.push({id:uid(), data, tipo:'entrada', categoria:'Venda', descricao:'Venda '+numero+(cliente?' — '+cliente.nome:''), valor:total});
    }
    if(cliente) cliente.totalComprado = (cliente.totalComprado||0)+total;
    // low stock notification
    itens.forEach(i=>{ const p = DB.produtos.find(x=>x.id===i.produtoId); if(p && p.stock<=p.stockMin && p.stock!==9999) toast('Stock baixo: '+p.nome+' ('+p.stock+' restantes)', 'warn'); });
    saveDB(); this.closeModal();
    toast('Venda registada — factura '+numero+' emitida.');
    DB.route='facturas'; render();
  },

    const cliente = DB.clientes.find(c=>c.id===f.clienteId);
    if(cliente) cliente.divida = Math.max(0,(cliente.divida||0)-f.total);
    DB.caixa.movimentos.push({id:uid(), data:todayISO(), tipo:'entrada', categoria:'Recebimento', descricao:'Recebimento factura '+f.numero, valor:f.total});
    saveDB(); render(); toast('Factura marcada como paga.');

/* ---------------- COMPUTED HELPERS ---------------- */
function saldoCaixa(){
  return (DB.caixa.saldoInicial||0) + DB.caixa.movimentos.reduce((s,m)=>s+(m.tipo==='entrada'?m.valor:-m.valor),0);
}
function vendasHoje(){ return DB.vendas.filter(v=>v.data===todayISO()).reduce((s,v)=>s+v.total,0); }
function vendasMes(){ const m = todayISO().slice(0,7); return DB.vendas.filter(v=>v.data.slice(0,7)===m).reduce((s,v)=>s+v.total,0); }
function produtosBaixoStock(){ return DB.produtos.filter(p=>p.stock<=p.stockMin && p.stock!==9999); }
function dividasReceber(){ return DB.clientes.reduce((s,c)=>s+(c.divida||0),0); }
function despesasMes(){ const m = todayISO().slice(0,7); return DB.caixa.movimentos.filter(mv=>mv.tipo==='saida' && mv.data.slice(0,7)===m).reduce((s,mv)=>s+mv.valor,0); }
function receitasMes(){ const m = todayISO().slice(0,7); return DB.caixa.movimentos.filter(mv=>mv.tipo==='entrada' && mv.data.slice(0,7)===m).reduce((s,mv)=>s+mv.valor,0); }

function mountDashboardCharts(){
  if(typeof Chart === 'undefined') return;
  const style = getComputedStyle(document.documentElement);
  const primary = style.getPropertyValue('--primary').trim() || '#1B4332';
  const border = style.getPropertyValue('--border').trim() || '#ddd';
  const textMuted = style.getPropertyValue('--text-muted').trim() || '#666';
  const danger = style.getPropertyValue('--danger').trim() || '#B3261E';

  const days = []; const labels = [];
  for(let i=6;i>=0;i--){ const d = daysAgoISO(i); days.push(d); const dt = new Date(d+'T00:00:00'); labels.push(dt.toLocaleDateString('pt-PT',{weekday:'short'})); }
  const vals = days.map(d=> DB.vendas.filter(v=>v.data===d).reduce((s,v)=>s+v.total,0));

  const c1 = document.getElementById('chart-sales');
  if(c1){
    new Chart(c1, {type:'bar', data:{labels, datasets:[{data:vals, backgroundColor:primary, borderRadius:6, maxBarThickness:34}]},
      options:{plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}, ticks:{color:textMuted}}, y:{grid:{color:border}, ticks:{color:textMuted, callback:v=>v/1000+'k'}} }, responsive:true, maintainAspectRatio:false}});
  }
  const c2 = document.getElementById('chart-flow');
  if(c2){
    new Chart(c2, {type:'doughnut', data:{labels:['Receitas','Despesas'], datasets:[{data:[receitasMes(), despesasMes()||1], backgroundColor:[primary, danger], borderWidth:0}]},
      options:{plugins:{legend:{position:'bottom', labels:{color:textMuted, boxWidth:10, font:{size:11}}}}, responsive:true, maintainAspectRatio:false, cutout:'65%'}});
  }
}

  return '<div class="page-head"><div><h1 class="page-title">Clientes</h1><p class="page-desc">'+DB.clientes.length+' clientes registados.</p></div>'
    +'<button class="btn btn-primary" onclick="App.formCliente()">'+icon('plus')+' Novo cliente</button></div>'
    +'<div class="card"><div class="scroll-x"><table><thead><tr><th>Cliente</th><th>Telefone</th><th style="text-align:right">Total comprado</th><th style="text-align:right">Dívida</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---------------- RENDER: FORNECEDORES ---------------- */
function renderFornecedores(){
  const rows = DB.fornecedores.map(f=>'<tr><td><strong>'+esc(f.nome)+'</strong><div style="font-size:11.5px;color:var(--text-muted)">'+esc(f.nif||'-')+'</div></td>'
    +'<td>'+esc(f.telefone||'-')+'</td><td>'+esc(f.produtos||'-')+'</td>'
    +'<td style="text-align:right">'+(f.divida>0?'<span class="pill pill-warning">'+kz(f.divida)+'</span>':'<span class="pill pill-muted">—</span>')+'</td>'
    +'<td><button class="btn btn-ghost btn-sm" onclick="App.formFornecedor(\''+f.id+'\')">'+icon('edit')+'</button></td></tr>').join('')
    || '<tr><td colspan="5" class="empty">Sem fornecedores registados.</td></tr>';
  return '<div class="page-head"><div><h1 class="page-title">Fornecedores</h1><p class="page-desc">'+DB.fornecedores.length+' fornecedores registados.</p></div>'
    +'<button class="btn btn-primary" onclick="App.formFornecedor()">'+icon('plus')+' Novo fornecedor</button></div>'
    +'<div class="card"><div class="scroll-x"><table><thead><tr><th>Fornecedor</th><th>Telefone</th><th>Produtos fornecidos</th><th style="text-align:right">Dívida</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---------------- RENDER: COMPRAS ---------------- */
function renderCompras(){
  const rows = DB.compras.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(c=>{
    const f = DB.fornecedores.find(x=>x.id===c.fornecedorId);
    return '<tr><td>'+fmtDate(c.data)+'</td><td>'+esc(f?f.nome:'—')+'</td><td>'+c.itens.length+' item(ns)</td>'
      +'<td><span class="pill pill-muted">'+esc(c.pagamento)+'</span></td><td style="text-align:right">'+kz(c.total)+'</td></tr>';
  }).join('') || '<tr><td colspan="5" class="empty">Sem compras registadas.</td></tr>';
  return '<div class="page-head"><div><h1 class="page-title">Compras</h1><p class="page-desc">Registo de compras — actualiza o estoque automaticamente.</p></div>'
    +'<button class="btn btn-primary" onclick="App.formCompra()">'+icon('plus')+' Registar compra</button></div>'
    +'<div class="card"><div class="scroll-x"><table><thead><tr><th>Data</th><th>Fornecedor</th><th>Itens</th><th>Pagamento</th><th style="text-align:right">Total</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---------------- RENDER: CAIXA ---------------- */
function renderCaixa(){
  const saldo = saldoCaixa();
  const movs = DB.caixa.movimentos.slice().sort((a,b)=>b.data.localeCompare(a.data)).slice(0,40);
  const rows = movs.map(m=>'<tr><td>'+fmtDate(m.data)+'</td><td>'+esc(m.categoria)+'</td><td>'+esc(m.descricao)+'</td>'
    +'<td style="text-align:right;color:'+(m.tipo==='entrada'?'var(--success)':'var(--danger)')+';font-weight:600;">'
    +(m.tipo==='entrada'?'+ ':'- ')+kz(m.valor)+'</td></tr>').join('') || '<tr><td colspan="4" class="empty">Sem movimentos ainda.</td></tr>';
  return '<div class="page-head"><div><h1 class="page-title">Caixa</h1><p class="page-desc">Estado: '
    +(DB.caixa.aberto?'<span class="pill pill-success">Aberto</span>':'<span class="pill pill-muted">Fechado</span>')+'</p></div>'
    +'<div style="display:flex;gap:8px;"><button class="btn" onclick="App.toggleCaixa()">'+(DB.caixa.aberto?'Fechar caixa':'Abrir caixa')+'</button>'
    +'<button class="btn btn-primary" onclick="App.formMovimento()">'+icon('plus')+' Novo movimento</button></div></div>'
    +'<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);">'
    +'<div class="card kpi"><span class="kpi-label">Saldo actual</span><div class="kpi-value">'+kz(saldo)+'</div></div>'
    +'<div class="card kpi"><span class="kpi-label">Receitas do mês</span><div class="kpi-value" style="color:var(--success)">'+kz(receitasMes())+'</div></div>'
    +'<div class="card kpi"><span class="kpi-label">Despesas do mês</span><div class="kpi-value" style="color:var(--danger)">'+kz(despesasMes())+'</div></div>'
    +'</div>'
    +'<div class="card"><div class="card-head"><h3 class="section-title">Movimentos recentes</h3></div><div class="scroll-x"><table><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th style="text-align:right">Valor</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

/* ---------------- RENDER: RELATORIOS ---------------- */
function renderRelatorios(){
  const cards = [
    {t:'Facturação do mês', v:kz(vendasMes())},
    {t:'Nº de vendas', v:DB.vendas.length},
    {t:'Nº de facturas', v:DB.facturas.length},
    {t:'Contas a receber', v:kz(dividasReceber())},
    {t:'Despesas do mês', v:kz(despesasMes())},
    {t:'Valor em estoque', v:kz(DB.produtos.reduce((s,p)=>s+(p.stock!==9999?p.stock*p.precoCompra:0),0))},
  ];
  const cardsHtml = cards.map(c=>'<div class="card kpi"><span class="kpi-label">'+c.t+'</span><div class="kpi-value">'+c.v+'</div></div>').join('');
  const byProduct = {};
  DB.vendas.forEach(v=>v.itens.forEach(i=>{ byProduct[i.nome]=(byProduct[i.nome]||0)+i.qtd; }));
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topRows = topProducts.map(([nome,qtd])=>'<tr><td>'+esc(nome)+'</td><td style="text-align:right">'+qtd+' unid.</td></tr>').join('') || '<tr><td colspan="2" class="empty">Sem dados suficientes.</td></tr>';
  return '<div class="page-head"><div><h1 class="page-title">Relatórios</h1><p class="page-desc">Resumo da actividade da empresa.</p></div>'
    +'<button class="btn" onclick="App.exportNotice()">'+icon('chart')+' Exportar PDF/Excel</button></div>'
    +'<div class="kpi-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;">'+cardsHtml+'</div>'
    +'<div class="card"><div class="card-head"><h3 class="section-title">Produtos mais vendidos</h3></div><div class="scroll-x"><table><thead><tr><th>Produto</th><th style="text-align:right">Quantidade vendida</th></tr></thead><tbody>'+topRows+'</tbody></table></div></div>';
}

/* ---------------- MAIN RENDER ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!SESSION){ app.innerHTML = renderLogin(); return; }
  let inner;
  switch(DB.route){
    case 'vendas': inner = renderVendas(); break;
    case 'facturas': inner = renderFacturas(); break;
    case 'estoque': inner = renderEstoque(); break;
    case 'clientes': inner = renderClientes(); break;
    case 'fornecedores': inner = renderFornecedores(); break;
    case 'compras': inner = renderCompras(); break;
    case 'caixa': inner = renderCaixa(); break;
    case 'relatorios': inner = renderRelatorios(); break;
    default: inner = renderDashboard();
  }
  app.innerHTML = renderShellOpen(inner);
  if(DB.route==='dashboard' || !DB.route) mountDashboardCharts();
}

render();
})();
</script>
</body>
</html>
